name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy to Server
      run: |
        echo "Deploying to server..."
        ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << EOF

        set -e

        cd /home/vmukti/AI-demo

        # ------------------------
        # GIT SETUP
        # ------------------------
        if [ ! -d .git ]; then
          git init
        fi

        git remote remove origin 2>/dev/null || true
        git remote add origin https://krushnal07:${{ secrets.GH_TOKEN }}@github.com/krushnal07/AI-demo.git

        git fetch origin main

        # ------------------------
        # DETECT WHICH FOLDERS CHANGED since last successful deploy
        # ------------------------
        PREV_COMMIT=\$(cat .last_deployed_commit 2>/dev/null || echo "")

        if [ -z "\$PREV_COMMIT" ] || ! git cat-file -e "\$PREV_COMMIT" 2>/dev/null; then
          echo "No previous deploy record found. Will deploy both backend and frontend."
          BACKEND_CHANGED=true
          FRONTEND_CHANGED=true
        else
          CHANGED_FILES=\$(git diff --name-only "\$PREV_COMMIT" origin/main)
          echo "Changed files since last deploy:"
          echo "\$CHANGED_FILES"

          if echo "\$CHANGED_FILES" | grep -q "^arcis_backend_R-D/"; then
            BACKEND_CHANGED=true
          else
            BACKEND_CHANGED=false
          fi

          if echo "\$CHANGED_FILES" | grep -q "^arcis_frontend_R-D/"; then
            FRONTEND_CHANGED=true
          else
            FRONTEND_CHANGED=false
          fi
        fi

        # Clean up any leftover temp_frontend from a previous run BEFORE git clean,
        # so git clean doesn't treat its contents as untracked files to delete
        chmod -R u+w temp_frontend 2>/dev/null || true
        rm -rf temp_frontend 2>/dev/null || true

        git reset --hard origin/main
        git clean -fd

        # =========================
        # BACKEND DEPLOY
        # =========================
        if [ "\$BACKEND_CHANGED" = "true" ]; then
          echo "Backend changes detected, deploying backend..."
          cd arcis_backend_R-D

          NEW_HASH=\$(md5sum package.json package-lock.json 2>/dev/null | md5sum | awk '{print \$1}')
          OLD_HASH=\$(cat .deps_hash 2>/dev/null || echo "none")

          if [ "\$NEW_HASH" != "\$OLD_HASH" ]; then
            echo "Dependencies changed, running npm install..."
            npm install
            echo "\$NEW_HASH" > .deps_hash
          else
            echo "No dependency changes, skipping npm install."
          fi

          sudo systemctl restart arcis-ai-demo-backend.service
          echo "Backend restarted successfully."
          cd ..
        else
          echo "No backend changes, skipping backend deploy."
        fi

        # =========================
        # FRONTEND ZERO-DOWNTIME
        # =========================
        if [ "\$FRONTEND_CHANGED" = "true" ]; then
          echo "Frontend changes detected, deploying frontend..."

          chmod -R u+w temp_frontend 2>/dev/null || true
          rm -rf temp_frontend
          mkdir temp_frontend

          # Copy only required files (exclude node_modules and build)
          rsync -av --exclude=node_modules --exclude=build arcis_frontend_R-D/ temp_frontend/

          cd temp_frontend

          NEW_HASH=\$(md5sum package.json package-lock.json 2>/dev/null | md5sum | awk '{print \$1}')
          OLD_HASH=\$(cat ../arcis_frontend_R-D/.deps_hash 2>/dev/null || echo "none")

          if [ "\$NEW_HASH" != "\$OLD_HASH" ]; then
            echo "Dependencies changed, running npm install..."
            npm install
            echo "\$NEW_HASH" > .deps_hash_new
          else
            echo "No dependency changes, reusing existing node_modules..."
            rm -rf node_modules
            cp -r ../arcis_frontend_R-D/node_modules ./node_modules
          fi

          export NODE_OPTIONS="--max-old-space-size=3072"
          npm run build

          cd ..

          # Atomic swap of build folder
          rm -rf arcis_frontend_R-D/build
          mv temp_frontend/build arcis_frontend_R-D/

          # Preserve dependency hash and node_modules for next deploy's comparison
          if [ -f temp_frontend/.deps_hash_new ]; then
            mv temp_frontend/.deps_hash_new arcis_frontend_R-D/.deps_hash
            rm -rf arcis_frontend_R-D/node_modules
            mv temp_frontend/node_modules arcis_frontend_R-D/node_modules
          fi

          chmod -R u+w temp_frontend 2>/dev/null || true
          rm -rf temp_frontend

          sudo systemctl restart arcis-ai-demo-frontend.service
          echo "Frontend restarted successfully."
        else
          echo "No frontend changes, skipping frontend deploy."
        fi

        # Record this commit as the last successfully deployed commit
        git rev-parse origin/main > .last_deployed_commit

        echo "Deployment completed successfully!!"

        EOF
